version: v1
plugins:
  - name: go
    out: .
    opt: paths=source_relative
  - name: connect-go
    out: .
    opt: paths=source_relative
  - name: es
    out: ../Frontend/src/app/shared/services/client
    opt: target=ts
  - name: connect-es
    out: ../Frontend/src/app/shared/services/client
    opt: target=ts
