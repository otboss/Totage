message CreateFreightOrderCommand {
    OrderDetails orderDetails = 1;
    Customer customer = 2;
    shared.RecaptchaEvent recaptchaEvent = 3;

    message OrderDetails {
        int64 organizationId = 2;
        repeated Location waypointAddresses = 3 [(buf.validate.field).repeated.min_items = 2];
        shared.PaymentMethod paymentMethod = 4;
        shared.Truck truck = 5;
        optional int64 bankAccountInfoId = 6;
        optional int64 jobDate = 7;
        optional string discountCode = 8 [
            (buf.validate.field).string = {
                len: 16,
                pattern: "^[A-Z0-9]+$"
            }
        ];
    }
}

message CreateBlockOrderCommand {
    OrderDetails orderDetails = 1;
    Customer customer = 2;
    shared.RecaptchaEvent recaptchaEvent = 3;

    message OrderDetails {
        int64 organizationId = 2;
        Location deliveryLocation = 6 [(buf.validate.field).repeated.min_items = 2];
        shared.PaymentMethod paymentMethod = 3;
        int32 quantityOfBlocks = 4 [
            (buf.validate.field).int32.gte = 0
        ];
        optional int64 bankAccountInfoId = 5;
        optional int64 jobDate = 7;
        optional string discountCode = 8 [
            (buf.validate.field).string = {
                len: 16,
                pattern: "^[A-Z0-9]+$"
            }
        ];
    }
}

message CreateOrderResponse {
    string orderId = 1;
    optional PaypalOrderInfo paypalOrderInfo = 2;

    message PaypalOrderInfo {
        string status = 2;
        repeated Link links = 3;

        message Link {
            string href = 1;
            string rel = 2;
            string method = 3;
        }
    } 
}

message CreateIceOrderCommand {
    OrderDetails orderDetails = 1;
    Customer customer = 2;
    shared.RecaptchaEvent recaptchaEvent = 3;

    message OrderDetails {
        int64 organizationId = 2;
        Location deliveryLocation = 6 [(buf.validate.field).repeated.min_items = 2];
        shared.PaymentMethod paymentMethod = 3;
        int32 quantityOfIce = 4 [
            (buf.validate.field).int32.gte = 0
        ];
        optional int64 bankAccountInfoId = 5;
        optional int64 jobDate = 7;
        optional string discountCode = 8 [
            (buf.validate.field).string = {
                len: 16,
                pattern: "^[A-Z0-9]+$"
            }
        ];
    }
}

message CreateDiscountCodeCommand {
    int64 organizationId = 1;
    string discountCode = 2;
    DiscountCodeType discountCodeType = 3;
    double value = 4;
}

message CreateDiscountCodeResponse {
    int64 id = 1;
}

message GetDiscountCodesQuery {
    int64 organizationId = 1;
    shared.Pagination pagination = 2;
}

message GetDiscountCodesResponse {
    repeated DiscountCodes discountCodes = 2;

    message DiscountCodes {
        string discountCode = 1;
        DiscountCodeType discountCodeType = 2;
        double value = 3;
        string createdAt = 4;
    }
}

message DeleteDiscountCodeCommand {
    int64 organizationId = 1;
    int64 discountCodeId = 2;
}

message DeleteDiscountCodeResponse {
    
}

message CreateEggOrderCommand {
    OrderDetails orderDetails = 1;
    Customer customer = 2;
    shared.RecaptchaEvent recaptchaEvent = 3;

    message OrderDetails {
        int64 organizationId = 2;
        Location deliveryLocation = 6 [(buf.validate.field).repeated.min_items = 2];
        shared.PaymentMethod paymentMethod = 3;
        int32 quantityOfEggs = 4 [
            (buf.validate.field).int32.gte = 0
        ];
        optional int64 bankAccountInfoId = 5;
        optional int64 jobDate = 7;
        optional string discountCode = 8 [
            (buf.validate.field).string = {
                len: 16,
                pattern: "^[A-Z0-9]+$"
            }
        ];
    }
}

message CreateCharcoalOrderCommand {
    OrderDetails orderDetails = 1;
    Customer customer = 2;
    shared.RecaptchaEvent recaptchaEvent = 3;

    message OrderDetails {
        int64 organizationId = 2;
        Location deliveryLocation = 6 [(buf.validate.field).repeated.min_items = 2];
        shared.PaymentMethod paymentMethod = 3;
        int32 quantityOfCharcoal = 4 [
            (buf.validate.field).int32.gte = 0
        ];
        optional int64 bankAccountInfoId = 5;
        optional int64 jobDate = 7;
        optional string discountCode = 8 [
            (buf.validate.field).string = {
                len: 16,
                pattern: "^[A-Z0-9]+$"
            }
        ];   
    }
}

message CreateRentalVehicleOrderCommand {
    OrderDetails orderDetails = 1;
    Customer customer = 2;
    shared.RecaptchaEvent recaptchaEvent = 3;

    message OrderDetails {
        int64 rentalVehicleId = 1;
        int64 organizationId = 2;
        int64 startDate = 3;
        int64 endDate = 4;
        shared.PaymentMethod paymentMethod = 5;
        optional int64 bankAccountInfoId = 6;
        optional string discountCode = 8 [
            (buf.validate.field).string = {
                len: 16,
                pattern: "^[A-Z0-9]+$"
            }
        ];
    }
}

message GetFreightOrderTotalQuery {
    int64 truckId = 2;
    repeated Location waypointAddresses = 1;
    optional string discountCode = 8 [
        (buf.validate.field).string = {
            len: 16,
            pattern: "^[A-Z0-9]+$"
        }
    ];
}

message GetOrderTotalResponse {
    Organization organization	= 1;
    Total total = 3;

    message Total {
        double value = 1;
        double discountValue = 4;
        string currency = 2;
        double exchangeRateUsd = 3;
    }

    message Organization {
        int64 id = 1;
        string name = 2;
        string address = 3;
        string phone = 4;

        optional string paypalClientId = 5 [
            (buf.validate.field).string.pattern = "^[a-zA-Z0-9]{30,80}$"
        ];
        repeated BankAccountInfo bankAccountInfo = 6;
    }
}

message GetEnrollmentQuery {
    int64 vehicleId = 1;
}

message GetEnrollmentResponse {
    repeated shared.OrderType orderTypes = 1;
}

message SetEnrollmentCommand {
    int64 vehicleId = 1;
    repeated shared.OrderType orderTypes = 2;
}

message SetEnrollmentResponse {

}

message GetCompatibleEnrollmentQuery {
    int64 vehicleId = 1;
}

message GetCompatibleEnrollmentResponse {
    repeated shared.OrderType orderTypes = 1;
}

message GetEggOrderTotalQuery {
    int64 organizationId = 9;
    string deliveryAddress = 1;
    optional int64 jobdate = 2;
    int32 quantityOfEggs = 3;
    optional string discountCode = 8 [
        (buf.validate.field).string = {
            len: 16,
            pattern: "^[A-Z0-9]+$"
        }
    ];
}

message GetIceOrderTotalQuery {
    int64 organizationId = 9;
    string deliveryAddress = 1;
    optional int64 jobdate = 2;
    int32 quantityOfIce = 3;
    optional string discountCode = 8 [
        (buf.validate.field).string = {
            len: 16,
            pattern: "^[A-Z0-9]+$"
        }
    ];
}

message GetOrderQuery {
    string orderId = 1;
}

message GetOrderResponse {
    string orderId = 1;
    optional google.protobuf.Timestamp paymentDate = 2;
    OrderStatus orderStatus = 3;
    google.protobuf.Timestamp createdAt = 4;
    shared.OrderType orderType= 5;
    optional int64 jobDate = 6;
    double distanceRoundTripInKm = 7;
    double totalInUsd = 8;


    enum OrderStatus {
        UNPAID    = 0;
        PENDING    = 1;
        PROCESSING = 2;
        COMPLETE   = 3;
    }
}

message GetUserOrdersQuery {
    shared.Pagination pagination = 1;
}

message GetUserOrdersResponse {
    repeated GetOrderResponse orders = 1;
}

message GetOrganizationOrdersQuery {
    int64 organizationId = 1;
    shared.Pagination pagination = 2;
}

message GetOrganizationOrdersResponse {
    repeated GetOrderResponse orders = 1;
}

