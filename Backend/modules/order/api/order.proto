message CreatePotableWaterOrderCommand {
    OrderDetails orderDetails = 1;
    Customer customer = 2;
    shared.RecaptchaEvent recaptchaEvent = 3;

    message OrderDetails {
        int64 organizationId = 2;
        Location deliveryLocation = 6 [(buf.validate.field).repeated.min_items = 2];
        int32 quantityOfWater = 8 [
            (buf.validate.field).int32.gte = 0
        ];
        bool bottlesRequired = 7;
        shared.PaymentMethod paymentMethod = 3;
        optional int64 bankAccountInfoId = 11;
        optional int64 jobDate = 16;
        optional string discountCode = 12 [
            (buf.validate.field).string = {
                len: 16,
                pattern: "^[A-Z0-9]+$"
            }
        ];
    }
}

message CreateIrrigationWaterOrderCommand {
    OrderDetails orderDetails = 1;
    Customer customer = 2;
    shared.RecaptchaEvent recaptchaEvent = 3;

    message OrderDetails {
        int64 organizationId = 2;
        Location deliveryLocation = 6 [(buf.validate.field).repeated.min_items = 2];
        int32 quantityOfWater = 8 [
            (buf.validate.field).int32.gte = 0
        ];
        bool barrelsRequired = 7;
        int32 quantityOfBarrels = 17 [
            (buf.validate.field).int32.gte = 0
        ];
        shared.PaymentMethod paymentMethod = 3;
        optional int64 bankAccountInfoId = 11;
        optional int64 jobDate = 16;
        optional string discountCode = 12 [
            (buf.validate.field).string = {
                len: 16,
                pattern: "^[A-Z0-9]+$"
            }
        ];
    }
}

