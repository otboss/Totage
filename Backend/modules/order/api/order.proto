message Schedule {
    int32 truckCount= 1;
    google.protobuf.Timestamp currentTimestamp= 2;
    repeated JobGroup orders= 3; 
}

message JobGroup {
    google.protobuf.Timestamp timestamp= 1;
    repeated Job items = 2;
}

message Job {
    int64 orderId= 1;
    double jobRoundTripDistanceInKm= 2;
    shared.OrderType orderType= 3;
}

enum Currency {
    USD = 0;
    JMD = 1;
}

message BankAccountInfo {
    int64 id = 1;
    string bank = 2;
    string bankBranch = 3;
    BankAccountType type = 4;
    BankAccountOwnership ownership = 5;
    string number = 6;
    string name = 7;
    string swiftCode = 8;

    enum BankAccountType {
        SAVINGS = 0;
        CHEQUING = 1;
    }

    enum BankAccountOwnership {
        PERSONAL = 0;
        BUSINESS = 1;
    }
}


message Location {
    string address = 1 [(buf.validate.field).string.min_len = 5];
    optional shared.Coordinates coordinates = 2;
}

enum DiscountCodeType {
    FIXED = 0;
    PERCENT = 1;
}