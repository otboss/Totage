message GetOrderTypesAvailableInCountryQuery {
    optional shared.CountryCodeAlpha2 country = 1;
}

message GetOrderTypesAvailableInCountryResponse {
    repeated shared.OrderType supportedOrderTypes = 1;
}

message Customer {
    string name = 1 [
        (buf.validate.field).string.max_len = 255
    ];
    string phone = 2 [
        (buf.validate.field).string.min_len = 10,
        (buf.validate.field).string.max_len = 15
    ];
    shared.CountryCodeAlpha2 phoneCountryCodeAlpha2 = 3;
    optional string email = 4 [
        (buf.validate.field).string.email = true
    ];
}

