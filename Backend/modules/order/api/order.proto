syntax = "proto3";

package v1;

import "google/protobuf/timestamp.proto";
import "shared/api/order_type.proto";
import "shared/api/truck.proto";
import "shared/api/coordinates.proto";
import "shared/api/country.proto";
import "shared/api/recaptcha_event.proto";
import "shared/api/pagination.proto";
import "shared/api/job_timeslot.proto";
import "shared/api/payment_method.proto";

import "buf/validate/validate.proto";
import "google/type/date.proto";

option go_package = "waterordersystem/GOBACKEND/modules/order/api;endpoints";

service OrderService {

    rpc GetOrderTypesAvailableInCountryHandler(GetOrderTypesAvailableInCountryQuery) returns (GetOrderTypesAvailableInCountryResponse);

    rpc CreatePotableWaterOrderHandler(CreatePotableWaterOrderCommand) returns (CreateOrderResponse);
    rpc CreateIrrigationWaterOrderHandler(CreateIrrigationWaterOrderCommand) returns (CreateOrderResponse);

    rpc CreateFreightOrderHandler(CreateFreightOrderCommand) returns (CreateOrderResponse);
    rpc CreateBlockOrderHandler(CreateBlockOrderCommand) returns (CreateOrderResponse);
    rpc CreateRentalVehicleOrderHandler (CreateRentalVehicleOrderCommand) returns (CreateOrderResponse);
    rpc CreateEggOrderHandler (CreateEggOrderCommand) returns (CreateOrderResponse);
    rpc CreateCharcoalOrderHandler (CreateCharcoalOrderCommand) returns (CreateOrderResponse);
    rpc CreateIceOrderHandler (CreateIceOrderCommand) returns (CreateOrderResponse);
    
    rpc GetFreightOrderTotalHandler(GetFreightOrderTotalQuery) returns (GetOrderTotalResponse);
    rpc GetPotableWaterOrderTotalHandler(GetPotableWaterOrderTotalQuery) returns (GetOrderTotalResponse);
    rpc GetIrrigationWaterOrderTotalHandler(GetIrrigationWaterOrderTotalQuery) returns (GetOrderTotalResponse);
    rpc GetBlockOrderTotalHandler(GetBlockOrderTotalQuery) returns (GetOrderTotalResponse);
    rpc GetRentalVehicleOrderTotalHandler (GetRentalVehicleOrderTotalQuery) returns (GetOrderTotalResponse);
    rpc GetEggOrderTotalHandler (GetEggOrderTotalQuery) returns (GetOrderTotalResponse);
    rpc GetIceOrderTotalHandler (GetIceOrderTotalQuery) returns (GetOrderTotalResponse);


    rpc GetEnrollmentHandler (GetEnrollmentQuery) returns (GetEnrollmentResponse);
    rpc SetEnrollmentHandler (SetEnrollmentCommand) returns (SetEnrollmentResponse);
    // rpc GetCompatibleEnrollmentHandler (GetCompatibleEnrollmentQuery) returns (GetCompatibleEnrollmentResponse);

    rpc CreateDiscountCodeHandler (CreateDiscountCodeCommand) returns (CreateDiscountCodeResponse);
    rpc GetDiscountCodesHandler (GetDiscountCodesQuery) returns (GetDiscountCodesResponse);
    rpc DeleteDiscountCodeHandler (DeleteDiscountCodeCommand) returns (DeleteDiscountCodeResponse);

    rpc GetOrderHandler(GetOrderQuery) returns (GetOrderResponse);
    rpc GetUserOrdersHandler(GetUserOrdersQuery) returns (GetUserOrdersResponse);
    rpc GetOrganizationOrdersHandler(GetOrganizationOrdersQuery) returns (GetOrganizationOrdersResponse);

    rpc ConfirmBankTransferHandler(ConfirmBankTransferCommand) returns (ConfirmBankTransferResponse);
    rpc GetPaypalOrderHandler(GetPaypalOrderQuery) returns (GetPaypalOrderResponse);
}

message GetPaypalOrderQuery {
    string paypalOrderId = 1;
}

message GetPaypalOrderResponse {
    string orderId = 1;
    int64 paymentDate = 2;
    int64 createdOn = 3;
}


message ConfirmBankTransferCommand {
    string orderIdEncrypted = 1;
}

message ConfirmBankTransferResponse {
    BankTransferConfirmationStatus confirmationStatus = 1;

    enum BankTransferConfirmationStatus {
        CONFIRMED = 0;
        ALREADY_CONFIRMED = 1;
        FAILED_TO_CONFIRM = 2;
    }
}

