import "shared/api/job_timeslot.proto";

import "buf/validate/validate.proto";

option go_package = "waterordersystem/GOBACKEND/modules/logistic/api;endpoints";

service LogisticService {
    rpc GetLogisticQueueSizeHandler(GetLogisticQueueSizeQuery) returns (GetLogisticQueueSizeResponse);
    rpc CompleteLogisticHandler(CompleteLogisticCommand) returns (CompleteLogisticResponse);
    rpc GetLogisticScheduleHandler(GetLogisticScheduleQuery) returns (GetLogisticScheduleResponse);

    rpc CreateVehicleHandler (CreateVehicleCommand) returns (CreateVehicleResponse);
    rpc UpdateVehicleDriverHandler (UpdateVehicleDriverCommand) returns (UpdateVehicleDriverResponse);
    rpc DeleteVehicleHandler (DeleteVehicleCommand) returns (DeleteVehicleResponse);

    rpc CreateTruckHandler (CreateTruckCommand) returns (CreateTruckResponse);
    rpc CreateRentalVehicleHandler (CreateRentalVehicleCommand) returns (CreateRentalVehicleResponse);
    rpc CreateVehicleOrderTypeAllocationHandler (CreateVehicleOrderTypeAllocationCommand) returns (CreateVehicleOrderTypeAllocationResponse);

    rpc TogglePublicityRentalVehicleHandler (TogglePublicityRentalVehicleCommand) returns (TogglePublicityRentalVehicleResposnse);
    rpc TogglePublicityTruckHandler (TogglePublicityTruckTruckCommand) returns (TogglePublicityTruckTruckResponse);

    rpc GetVehicleHandler (GetVehicleQuery) returns (GetVehicleResponse);
    rpc GetRentalVehicleHandler (GetRentalVehicleQuery) returns (GetRentalVehicleResponse);
    rpc GetTruckHandler (GetTruckQuery) returns (GetTruckResponse);
    

    // rpc GetTrucksHandler (GetTrucksQuery) returns (GetTrucksResponse);
    // rpc GetRentalVehiclesHandler (GetRentalVehiclesQuery) returns (GetRentalVehiclesResponse);
 

    rpc GetVehiclesHandler (GetVehiclesQuery) returns (GetVehiclesResponse);

    rpc GetFreightTruckClassesNearbyHandler(GetFreightTruckClassesNearbyQuery) returns (GetFreightTruckClassesNearbyResponse);

    rpc GetFreightTrucksNearbyHandler (GetFreightTrucksNearbyQuery) returns (GetTrucksNearbyResponse);
    rpc GetBulkGoodTrucksNearbyHandler (GetBulkGoodTrucksNearbyQuery) returns (GetTrucksNearbyResponse);
    rpc GetRentalVehiclesNearbyHandler (GetRentalVehiclesNearbyQuery) returns (GetRentalVehiclesNearbyResponse);

    rpc UpdateTruckLocationHandler (UpdateTruckLocationCommand) returns (UpdateTruckLocationResponse);

    rpc ValidateAddressesHandler (ValidateAddressesQuery) returns (ValidateAddressesResponse);
    rpc ReverseGeocodingHandler (ReverseGeocodingQuery) returns (ReverseGeocodingResponse);
    rpc GeocodingHandler (GeocodingQuery) returns (GeocodingResponse);

    rpc ApproveVehicleHandler (ApproveVehicleCommand) returns (ApproveVehicleResponse);


    // rpc CreateJobTimeslotHandler (CreateJobTimeslotCommand) returns (CreateJobTimeslotResponse);
    rpc SetJobTimeslotsHandler (SetJobTimeslotCommand) returns (SetJobTimeslotResponse);
    rpc DeleteJobTimeslotHandler (DeleteJobTimeslotCommand) returns (DeleteJobTimeslotResponse);
    rpc GetJobTimeslotsHandler (GetJobTimeslotsQuery) returns (GetJobTimeslotsResponse);
}


message SetJobTimeslotCommand {
    int64 vehicleId = 1 [
        (buf.validate.field).cel = {
            id: "vehicleId.required",
            message: "Vehicle Id is required",
            expression: "this != 0"
        }
    ];

    // Field-level CEL validation to prevent overlaps across the list of timeslots
    repeated shared.JobTimeslot jobTimeslots = 2 [
        (buf.validate.field).cel = {
            id: "jobTimeslots.no_overlap",
            message: "Timeslots cannot overlap on the same weekday",
            expression: "this.all(t1, this.all(t2, t1 == t2 || t1.weekdays.all(d, !t2.weekdays.exists(d2, d == d2)) || (t1.endHH * 60 + t1.endMM) <= (t2.startHH * 60 + t2.startMM) || (t2.endHH * 60 + t2.endMM) <= (t1.startHH * 60 + t1.startMM)))"
        }
    ];
}

message SetJobTimeslotResponse {

}

message DeleteJobTimeslotCommand {
    int64 jobTimeslotId = 1 [
        (buf.validate.field).cel = {
            id: "jobTimeslotId.required",
            message: "Job Timeslot Id is required",
            expression: "this != 0"
        }
    ];
}

message DeleteJobTimeslotResponse {

}

message GetJobTimeslotsQuery {
    int64 vehicleId = 1 [
        (buf.validate.field).cel = {
            id: "vehicleId.required",
            message: "Vehicle Id is required",
            expression: "this != 0"
        }
    ];
}

message GetJobTimeslotsResponse {
    repeated shared.JobTimeslot jobTimeslot = 1;
}

message GetLogisticScheduleQuery {
    int64 organizationId = 1;
    int32 month = 2;
    int64 truckId = 3;
}

message GetLogisticScheduleResponse {
    repeated Schedule schedule = 1;

    message Schedule {
        google.protobuf.Timestamp timestamp = 1;
        ScheduleItem scheduleItem = 2;

        message ScheduleItem {
            string orderId = 1;
            double jobRoundTripDistanceInKm = 2;
            string orderType = 3;
            shared.Truck truck = 4;
        }
    }
}


message GetLogisticQueueSizeQuery {
    int64 organizationId = 1;
}

message GetLogisticQueueSizeResponse {
    int32 currentSize = 1;
    optional int32 limit = 2;
}

message CompleteLogisticCommand {
    string orderId = 1;
}

message CompleteLogisticResponse {
    LogisticCompleteStatus status = 1;
}

enum LogisticCompleteStatus {
    NOT_FOUND = 0;
    COMPLETED = 1;
}

message CreateVehicleCommand {
    int64 organizationId = 1 [
        (buf.validate.field).cel = {
            id: "organizationId.required",
            message: "Organization id is required",
            expression: "this != 0"
        }
    ];
    int64 year = 2 [
        (buf.validate.field).cel = {
            id: "year.required",
            message: "Year is required",
            expression: "this != 0"
        },
        (buf.validate.field).cel = {
            id: "year.range",
            message: "Invalid year provided",
            expression: "this > 1900 && this < 2999"
        }
    ];
    string make = 3 [
        (buf.validate.field).cel = {
            id: "make.required",
            message: "Make is required",
            expression: "this.size() > 0"
        },
        (buf.validate.field).cel = {
            id: "make.max_len",
            message: "Max field length exceeded",
            expression: "this.size() <= 255"
        }
    ];
    string model = 4 [
        (buf.validate.field).cel = {
            id: "model.required",
            message: "Model is required",
            expression: "this.size() > 0"
        },
        (buf.validate.field).cel = {
            id: "model.max_len",
            message: "Max field length exceeded",
            expression: "this.size() <= 255"
        }
    ];
    string chassisNumber = 5 [
        (buf.validate.field).cel = {
            id: "chassisNumber.required",
            message: "Chassis number is required",
            expression: "this.size() > 0"
        },
        (buf.validate.field).cel = {
            id: "chassisNumber.max_len",
            message: "Max field length exceeded",
            expression: "this.size() <= 255"
        }
    ];
    string licensePlateNumber = 6 [
        (buf.validate.field).cel = {
            id: "licensePlateNumber.required",
            message: "License plate number is required",
            expression: "this.size() > 0"
        },
        (buf.validate.field).cel = {
            id: "licensePlateNumber.max_len",
            message: "Max field length exceeded",
            expression: "this.size() <= 255"
        }
    ];
    int64 seatingCapacity = 7 [
        (buf.validate.field).cel = {
            id: "seatingCapacity.range",
            message: "Invalid seating capacity provided",
            expression: "this > 0 && this < 1000"
        }
    ];
    FuelType fuelType = 8[
        (buf.validate.field).cel = {
            id: "fuelType.required",
            message: "Fuel type is required",
            expression: "this != 0"
        }
    ];
    bool isManualTransmission = 9;
    string driverAccountId = 10 [
        (buf.validate.field).cel = {
            id: "driverAccountId.required",
            message: "Driver account id is required",
            expression: "this.size() > 0"
        },
        (buf.validate.field).cel = {
            id: "driverAccountId.max_len",
            message: "Max field length exceeded",
            expression: "this.size() <= 255"
        }
    ];
}

message CreateVehicleResponse {
    int64 vehicleId = 1;
}

