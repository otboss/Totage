syntax = "proto3";

package shared;

import "buf/validate/validate.proto";

option go_package = "waterordersystem/GOBACKEND/shared/api;common";

message Coordinates {
  double latitude = 1 [(buf.validate.field).required = true, (buf.validate.field).double = { gte: -90, lte: 90 }];
  double longitude = 2 [(buf.validate.field).required = true, (buf.validate.field).double = { gte: -180, lte: 180 }];
}